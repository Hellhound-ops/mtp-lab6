{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <main>
    <h1>Вход</h1>
    {% if configured %}
      {% if invalid %}<p class="error" role="alert">Неверное имя или пароль.</p>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        <label>Имя <input name="username" autocomplete="username" required></label>
        <label>Пароль <input type="password" name="password" autocomplete="current-password" required></label>
        <button>Войти</button>
      </form>
    {% else %}
      <p>Задайте переменные окружения для учебного пользователя по инструкции в README.</p>
    {% endif %}
    <p><a href="{{ url_for('home') }}">На главную</a></p>
  </main>
{% endblock %}
